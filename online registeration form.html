<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration</title>
</head>
<body>
    <h1><b>--Online Course Registeration--</b></h1>
    <br>    
    <form>
        <label for="form1">Student Name:</label>
        <input type="text" id="form1">
    <br>
        <label for="form1">Email Address:</label>
        <input type="email" id="form1">
    <br>
        <label for="form1">Mobile Number:</label>
        <input type="number" id="form1">
    <br>
        <label for="form1">Age:</label>
        <input type="number" id="form1">
    <br>
        <label for="form1">Password:</label>
        <input type="password" id="form1">
    <br>
    <p>
        <label for="form2">Gender:</label>
        <label for="form2">Male</label>
        <input type="radio" id="form2" name="Gender">
        <label for="form2">Female</label>
        <input type="radio" id="form2" name="Gender">
        <label for="form2">Other</label>
        <input type="radio" id="form2" name="Gender">
    <br>
        <label>Skills:</label>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>Javascript</option>
            <option>Python</option>
        </select>
    </p>
    </form>
</body>
</html>
