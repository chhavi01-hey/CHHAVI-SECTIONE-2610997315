<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map explorer</title>
</head>
<body>
     <h1>World Map Explorer</h1>

    <p>Click on the image areas to explore different countries.</p>

    <img src="worldmap.jpg" alt="World Map"
         width="600" height="350" usemap="#worldmap">

    <map name="worldmap">

        <!-- Rectangle shape -->
        <area shape="rect"
              coords="80,100,180,180"
              href="https://en.wikipedia.org/wiki/India"
              alt="India"
              title="India"
              target="_blank">

        <!-- Circle shape -->
        <area shape="circle"
              coords="300,150,40"
              href="https://en.wikipedia.org/wiki/Australia"
              alt="Australia"
              title="Australia"
              target="_blank">

        <!-- Polygon shape -->
        <area shape="poly"
              coords="400,80,460,100,450,160,420,180,390,130"
              href="https://en.wikipedia.org/wiki/China"
              alt="China"
              title="China"
              target="_blank">

        <!-- Default area -->
        <area shape="default"
              href="https://en.wikipedia.org/wiki/World"
              alt="World"
              title="Explore the World"
              target="_blank">

    </map>

    <h2>Explore Countries</h2>

    <ul>
        <li>
            <a href="https://en.wikipedia.org/wiki/India"
               target="_blank">India</a>
        </li>

        <li>
            <a href="https://en.wikipedia.org/wiki/Australia"
               target="_blank">Australia</a>
        </li>

        <li>
            <a href="https://en.wikipedia.org/wiki/China"
               target="_blank">China</a>
        </li>
    </ul>

</body>
</html>
